[package]
name = "shellpilot-vnc-probe"
version = "1.0.0"
edition = "2021"

[dependencies]
aes = "0.8"
base64 = "0.22"
md5 = "0.7"
num-bigint = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
vnc-rs = "0.5.3"
