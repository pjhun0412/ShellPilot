[package]
name = "shellpilot-rdp-probe"
version = "0.0.1"
edition = "2021"

[dependencies]
base64 = "0.22"
ironrdp = { version = "0.16", features = ["connector", "core", "pdu", "session", "graphics", "svc", "dvc", "displaycontrol", "cliprdr"] }
ironrdp-blocking = "0.9"
ironrdp-bulk = "0.1.1"
ironrdp-graphics = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sspi = { version = "0.21", features = ["network_client"] }
tokio-rustls = "0.26"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-cert = { version = "0.2", features = ["std"], default-features = false }
