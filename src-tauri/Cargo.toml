[package]
name = "shellpilot"
version = "0.0.1"
description = "Modern remote workspace for SSH, SFTP, RDP, and AI Agent"
authors = ["ShellPilot"]
edition = "2021"

[lib]
name = "shellpilot_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
russh = { version = "0.62", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.3"
tokio = { version = "1", features = ["macros", "net", "sync", "time"] }
portable-pty = "0.8"
