name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.0.1"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    name: Build Windows exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run release:win:build

      - name: Prepare release asset
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = $tag.TrimStart("v")
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item -LiteralPath src-tauri\target\release\ShellPilot.exe -Destination "release-assets\ShellPilot-$version-portable.exe" -Force
          $setup = Get-ChildItem -Path src-tauri\target\release\bundle\nsis -Filter "*.exe" -Recurse | Select-Object -First 1
          if (-not $setup) {
            throw "NSIS setup executable was not found."
          }
          Copy-Item -LiteralPath $setup.FullName -Destination "release-assets\ShellPilot-$version-setup.exe" -Force
          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RELEASE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShellPilot-${{ env.RELEASE_VERSION }}-windows
          path: release-assets/*.exe

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ShellPilot ${{ env.RELEASE_TAG }}
          files: release-assets/*.exe
          generate_release_notes: true
